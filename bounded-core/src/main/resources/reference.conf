bounded {
    eventmaterializers.cassandra-offsetstore.createtable-timeout = 6s
    # Keyspace of the Cassandra offset store table (vw_offsetstore). When not set, the keyspace of the
    # configured journal plugin is used. Set it to "akka" to keep using the offsets stored by the Akka version.
    # eventmaterializers.cassandra-offsetstore.keyspace = "akka"

    # Config path of the Slick database config of the JDBC offset store (table OFFSET). When not set, the old key
    # pekko.persistence.offset.r2dbc.store is used if present, else the slick config of the journal (jdbc-journal.slick).
    # eventmaterializers.jdbc-offsetstore.database-config = "jdbc-journal.slick"

    # Config path of the R2DBC connection factory of the R2DBC offset store (table bounded_offset_store). When not
    # set, the connection factory of the R2DBC journal is used.
    # eventmaterializers.r2dbc-offsetstore.connection-factory = "pekko.persistence.r2dbc.connection-factory"

    # How a failing event materializer stream (live listening or replay) is restarted. It resumes after the last
    # handled event, so events are handled at least once. After max-restarts within max-restarts-within it stops
    # and the failure is logged.
    eventmaterializers.restart {
      min-backoff = 1s
      max-backoff = 30s
      random-factor = 0.2
      max-restarts = 10
      max-restarts-within = 10m
    }
}
