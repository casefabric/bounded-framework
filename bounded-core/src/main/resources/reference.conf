bounded {
    eventmaterializers.cassandra-offsetstore.createtable-timeout = 6s
    # Keyspace of the Cassandra offset store table (vw_offsetstore). When not set, the old key
    # cassandra.journal.keyspace (or cassandra-journal.keyspace) is used if present, with a warning, so an upgraded
    # deployment keeps its stored offsets; else the keyspace of the configured journal plugin.
    # eventmaterializers.cassandra-offsetstore.keyspace = "akka"

    # Config path of the Slick database config of the JDBC offset store (table OFFSET). When not set, the old key
    # pekko.persistence.offset.r2dbc.store is used if present, else the slick config of the journal (jdbc-journal.slick).
    # eventmaterializers.jdbc-offsetstore.database-config = "jdbc-journal.slick"

    # Config path of the R2DBC connection factory of the R2DBC offset store (table bounded_offset_store). When not
    # set, the connection factory of the R2DBC journal is used.
    # eventmaterializers.r2dbc-offsetstore.connection-factory = "pekko.persistence.r2dbc.connection-factory"

    # The R2DBC journal delivers events again from its backtracking queries; the event materializers drop them by
    # keeping the last delivered sequence number of this many persistence ids (the least recently seen are dropped).
    eventmaterializers.r2dbc.deduplicate-capacity = 10000

    # Waiting for a read side (io.cafienne.bounded.readside.ReadSideRegistry). It needs
    # eventmaterializers.publish = on, so the read sides publish their progress.
    read-side {
      # How long awaitProcessed waits when no timeout is given; then it answers Pending(TimedOut).
      timeout = 5s
      # How long the registry keeps what a read side processed for a persistence id without anyone waiting.
      # A wait for an event whose entry was dropped ends in Pending(TimedOut): keep this far above the read side lag.
      idle-retention = 5m
    }

    # How a failing event materializer stream (live listening or replay) is restarted. It resumes after the last
    # handled event, so events are handled at least once. After max-restarts within max-restarts-within it stops
    # and the failure is logged. A negative max-restarts restarts without a limit.
    eventmaterializers.restart {
      min-backoff = 1s
      max-backoff = 30s
      random-factor = 0.2
      max-restarts = 10
      max-restarts-within = 10m
    }
}

# Replies of aggregates (Ok, Ko) and Bounded's own handling failures cross nodes in a cluster with this serializer.
# The events, failures and commands inside them use the serializers the application binds to its own types.
pekko.actor {
  serializers {
    bounded-reply = "io.cafienne.bounded.aggregate.ReplySerializer"
  }
  serialization-bindings {
    "io.cafienne.bounded.aggregate.Ok" = bounded-reply
    "io.cafienne.bounded.aggregate.Persisted" = bounded-reply
    "io.cafienne.bounded.aggregate.Ko" = bounded-reply
    "io.cafienne.bounded.aggregate.PersistenceFailed" = bounded-reply
    "io.cafienne.bounded.aggregate.PersistenceRejected" = bounded-reply
    "io.cafienne.bounded.aggregate.UnexpectedCommand" = bounded-reply
  }
}
