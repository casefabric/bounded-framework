# Organization and project keys are displayed in the right sidebar of the project homepage
sonar.organization=cafienne
sonar.projectKey=casefabric_bounded-framework
sonar.host.url=https://sonarcloud.io

# defaults to project key
sonar.projectName=Bounded Framework
# defaults to 'not provided'
#sonar.projectVersion=1.0

# Paths are relative to the sonar-project.properties file.
sonar.sources=bounded-core/src/main,bounded-test/src/main,bounded-pekko-http/src/main
sonar.tests=bounded-core/src/test,bounded-test/src/test,bounded-pekko-http/src/test

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# sbt 2 writes all build output under the root target/out; the path contains the Scala version of build.sbt
sonar.scala.coverage.reportPaths=target/out/jvm/scala-3.3.9/bounded-pekko-http/scoverage-report/scoverage.xml,target/out/jvm/scala-3.3.9/bounded-test/scoverage-report/scoverage.xml,target/out/jvm/scala-3.3.9/bounded-core/scoverage-report/scoverage.xml

# Tests repeat literals (ids, tags, config) on purpose; don't ask for constants there.
sonar.issue.ignore.multicriteria=testLiterals
sonar.issue.ignore.multicriteria.testLiterals.ruleKey=scaladre:S1192
sonar.issue.ignore.multicriteria.testLiterals.resourceKey=**/src/test/**
