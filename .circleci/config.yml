version: 2.1
jobs:
  build:
    working_directory: ~/bounded-framework
    # A machine executor, so that Testcontainers can start the Postgres and Cassandra containers of the
    # offset store tests (the docker executor has no Docker daemon of its own)
    machine:
      image: ubuntu-2404:current
    environment:
      SBT_OPTS: "-XX:MaxMetaspaceSize=512m"
      JVM_OPTS: -Xmx3200m
      TERM: dumb
    steps:
      - run: echo 'export ARTIFACT_BUILD=$CIRCLE_PROJECT_REPONAME-$CIRCLE_BUILD_NUM.zip' >> $BASH_ENV
      - run:
          # The machine image has no JDK 25; install Temurin 25 from the Adoptium repository and select it
          name: Install JDK 25
          command: |
            curl -sL https://packages.adoptium.net/artifactory/api/gpg/key/public | sudo gpg --dearmor -o /usr/share/keyrings/adoptium.gpg
            echo "deb [signed-by=/usr/share/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb $(. /etc/os-release && echo $VERSION_CODENAME) main" | sudo tee /etc/apt/sources.list.d/adoptium.list
            sudo apt-get update
            sudo apt-get install -y temurin-25-jdk
            echo 'export JAVA_HOME=/usr/lib/jvm/temurin-25-jdk-amd64' >> $BASH_ENV
            echo 'export PATH=$JAVA_HOME/bin:$PATH' >> $BASH_ENV
      - run: java -version
      - run:
          # The image has no sbt; the installed launcher fetches the sbt version from project/build.properties
          name: Get sbt binary
          command: |
            curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo gpg --dearmor -o /usr/share/keyrings/sbt.gpg
            echo "deb [signed-by=/usr/share/keyrings/sbt.gpg] https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
            sudo apt-get update
            sudo apt-get install -y sbt
            sudo apt-get clean && sudo apt-get autoclean
      - add_ssh_keys
      - run:
          name: Checkout code
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            git clone git@github.com:${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git .
            git checkout -q ${CIRCLE_SHA1}
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/Dependencies.scala" }}-{{ checksum "project/plugins.sbt" }}-{{ checksum "project/build.properties" }}
            # fallback to using the latest cache if no exact match is found
            - v2-dependencies-
      - run:
          name: Run tests
          command: cat /dev/null | sbt coverage test coverageReport
          #- store_artifacts: # for display in Artifacts: https://circleci.com/docs/2.0/artifacts/
          #path: target/universal/samplescala.zip
          #destination: samplescala
      - save_cache:
          key: v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/Dependencies.scala" }}-{{ checksum "project/plugins.sbt" }}-{{ checksum "project/build.properties" }}
          paths:
            - "~/.cache/coursier"
            - "~/.ivy2/cache"
            - "~/.sbt"
            - "~/.m2"
      - sonarcloud/scan

orbs:
  sonarcloud: sonarsource/sonarcloud@4.0.0

workflows:
  version: 2
  ci:
    jobs:
      - build:
          context:
            - SonarCloudBounded
