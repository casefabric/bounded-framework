# The sources are shared by Scala 3 and Scala 2.13 (compiled with -Xsource:3): keep the scala3 dialect, but do not
# enable the rewrite.scala3 rules (new control syntax, optional braces), which produce syntax Scala 2.13 rejects.
version = 3.11.5
runner.dialect = scala3
preset = defaultWithAlign
maxColumn = 120
align.openParenDefnSite = false
align.openParenCallSite = false
indent.callSite = 2
indent.defnSite = 2
danglingParentheses.preset = true
docstrings.style = keep
newlines.implicitParamListModifierPrefer = before
